steps:
  - name: "gcr.io/cloud-builders/docker"
    id: "Build"
    args:
      [
        "build",
        "-t",
        "gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}",
        "-f",
        "license-reservation-backend/Dockerfile",
        ".",
      ]

  - name: "gcr.io/cloud-builders/docker"
    id: "Push"
    args: ["push", "gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}"]

  - name: "gcr.io/cloud-builders/gcloud"
    id: "Deploy to Cloud Run"
    args:
      [
        "run",
        "deploy",
        "${_SERVICE_NAME}",
        "--image=gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}",
        "--project=${_PROJECT_ID}",
        "--region=${_REGION}",
        "--vpc-connector=${_VPC_CONNECTOR_NAME}",
        "--set-env-vars=GCP_PROJECT_ID=${_PROJECT_ID},GCP_LOCATION=${_REGION},LICENSE_ALLOCATION_QUEUE=${_LICENSE_ALLOCATION_QUEUE},LICENSE_REVOCATION_QUEUE=${_LICENSE_REVOCATION_QUEUE},DOWNTIME_END_QUEUE=${_DOWNTIME_END_QUEUE},DOWNTIME_START_QUEUE=${_DOWNTIME_START_QUEUE},LICENSE_MANAGEMENT_API_ENDPOINT=${_LICENSE_MANAGEMENT_API_ENDPOINT},LICENSE_ENDPOINTS_INVOKER_SERVICE_ACCOUNT=${_LICENSE_ENDPOINTS_INVOKER_SERVICE_ACCOUNT},DB_USER=${_DB_USER},DB_HOST=${_DB_HOST},DB_PORT=${_DB_PORT},DB_NAME=${_DB_NAME},DB_PASSWORD_SECRET_NAME=${_DB_PASSWORD_SECRET_NAME},DELEGATED_ADMIN=${_DELEGATED_ADMIN},ADMIN_SERVICE_ACCOUNT_KEY_SECRET_NAME=${_ADMIN_SERVICE_ACCOUNT_KEY_SECRET_NAME},PORTAL_ADMIN_GROUP_EMAIL=${_PORTAL_ADMIN_GROUP_EMAIL}",
        "--allow-unauthenticated",
      ]

substitutions:
  _SERVICE_NAME: "license-reservation-backend-dev"
  _PROJECT_ID: "sys-36807655692543323281329778"
  _REGION: "us-central1"
  _VPC_CONNECTOR_NAME: "cloud-run-vpc-connector"
  _LICENSE_ALLOCATION_QUEUE: "license-allocation-Queue"
  _LICENSE_REVOCATION_QUEUE: "license-revocation-queue"
  _DOWNTIME_START_QUEUE: "application-downtime-start-queue"
  _DOWNTIME_END_QUEUE: "application-downtime-end-queue"
  _LICENSE_MANAGEMENT_API_ENDPOINT: "https://license-management-api-dev-385039775654.us-central1.run.app"
  _LICENSE_ENDPOINTS_INVOKER_SERVICE_ACCOUNT: "license-mgmt-api-invoker-sa@sys-36807655692543323281329778.iam.gserviceaccount.com"
  _DB_USER: "postgres"
  _DB_HOST: "10.20.163.4"
  _DB_PORT: "5432"
  _DB_NAME: "license-reservation-db"
  _DB_PASSWORD_SECRET_NAME: "license-reservation-db-password"
  _DELEGATED_ADMIN: "arpitgup@1987984870407.altostrat.com"
  _ADMIN_SERVICE_ACCOUNT_KEY_SECRET_NAME: "license-reservation-auth-sa-key"
