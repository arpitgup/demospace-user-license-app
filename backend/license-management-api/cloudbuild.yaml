steps:
  - name: "gcr.io/cloud-builders/docker"
    id: "Build"
    args:
      [
        "build",
        "-t",
        "gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}",
        "-f",
        "license-management-api/Dockerfile",
        ".",
      ]

  - name: "gcr.io/cloud-builders/docker"
    id: "Push"
    args: ["push", "gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}"]

  - name: "gcr.io/cloud-builders/gcloud"
    id: "Deploy to Cloud Run"
    args:
      [
        "run",
        "deploy",
        "${_SERVICE_NAME}",
        "--image=gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}",
        "--project=${_PROJECT_ID}",
        "--region=${_REGION}",
        "--vpc-connector=${_VPC_CONNECTOR_NAME}",
        "--set-env-vars=GCP_PROJECT_ID=${_PROJECT_ID},GCP_LOCATION=${_REGION},DB_USER=${_DB_USER},DB_HOST=${_DB_HOST},DB_PORT=${_DB_PORT},DB_NAME=${_DB_NAME},DB_PASSWORD_SECRET_NAME=${_DB_PASSWORD_SECRET_NAME},DELEGATED_ADMIN=${_DELEGATED_ADMIN},ADMIN_SERVICE_ACCOUNT_KEY_SECRET_NAME=${_ADMIN_SERVICE_ACCOUNT_KEY_SECRET_NAME}",
        "--no-allow-unauthenticated",
      ]

substitutions:
  _SERVICE_NAME: "license-management-api-dev"
  _PROJECT_ID: "sys-36807655692543323281329778"
  _REGION: "us-central1"
  _VPC_CONNECTOR_NAME: "cloud-run-vpc-connector"
  _DB_USER: "postgres"
  _DB_HOST: "10.20.163.4"
  _DB_PORT: "5432"
  _DB_NAME: "license-reservation-db"
  _DB_PASSWORD_SECRET_NAME: "license-reservation-db-password"
  _DELEGATED_ADMIN: "arpitgup@1987984870407.altostrat.com"
  _ADMIN_SERVICE_ACCOUNT_KEY_SECRET_NAME: "license-reservation-auth-sa-key"

images:
  - "gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}"
