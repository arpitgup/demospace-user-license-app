[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shared_lib"
version = "0.1.0"
description = "Shared library functions for license reservation backend services"
dependencies = [
    "boxsdk==3.*",
    "google-api-python-client==2.*",
    "google-auth==2.*",
    "google-cloud-secret-manager==2.*",
    "cachetools==5.5.*",
    "loguru==0.7.3",
    "psycopg2-binary==2.9.*",
    "sqlalchemy==2.*",
]