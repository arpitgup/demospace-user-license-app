<div class="mat-container">
  <ngx-skeleton-loader
    class="side-nav"
    [theme]="{ height: '100%', width: '100%' }"
  >
  </ngx-skeleton-loader>
  <div class="loader-content">
    <ngx-skeleton-loader
      class="header-content"
      [theme]="{ height: '150px', width: '100%' }"
    ></ngx-skeleton-loader>

    <div class="drive-loader">
      <div class="credentials-loader">
        <ngx-skeleton-loader
          class="logo-loader"
          [theme]="{ height: '100px', width: '100px' }"
        ></ngx-skeleton-loader>

        <ngx-skeleton-loader
          class="email-loader"
          [theme]="{ height: '20px', width: '100%' }"
        ></ngx-skeleton-loader>
        <ngx-skeleton-loader
          [theme]="{ height: '20px', width: '100%' }"
        ></ngx-skeleton-loader>
      </div>
      <div class="credentials-loader">
        <ngx-skeleton-loader
          class="logo-loader"
          [theme]="{ height: '100px', width: '100px' }"
        ></ngx-skeleton-loader>

        <ngx-skeleton-loader
          class="email-loader"
          [theme]="{ height: '20px', width: '100%' }"
        ></ngx-skeleton-loader>
        <ngx-skeleton-loader
          [theme]="{ height: '20px', width: '100%' }"
        ></ngx-skeleton-loader>
      </div>
    </div>

    <ngx-skeleton-loader
      class="note-loader"
      [theme]="{ height: '50px', width: '100%' }"
    ></ngx-skeleton-loader>

    <ngx-skeleton-loader
      class="note-loader"
      [theme]="{ height: '200px', width: '100%' }"
    ></ngx-skeleton-loader>
  </div>
</div>
