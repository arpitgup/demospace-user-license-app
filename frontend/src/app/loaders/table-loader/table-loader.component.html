<div class="table-loader-wrapper">
  @if(isShowHeader===true){
  <ngx-skeleton-loader
    [appearance]="'line'"
    [theme]="{ 'border-radius': '0', height: '60px', width: '100%' }"
  ></ngx-skeleton-loader>
  }

  <table mat-table [dataSource]="dataSource" class="custom-table">
    <!-- Select Column -->
    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef>
        <div class="show-past-checkbox-wrapper">
          <ngx-skeleton-loader
            [appearance]="'square'"
            [theme]="{ 'border-radius': '0', height: '20px',}"
          ></ngx-skeleton-loader>
        </div>
      </th>
      <td mat-cell *matCellDef="let element">
        <ngx-skeleton-loader
          [appearance]="'square'"
          [theme]="{ 'border-radius': '0', height: '20px',}"
        ></ngx-skeleton-loader>
      </td>
    </ng-container>

    <!-- Rervation Date Column -->
    <ng-container matColumnDef="reservationDate">
      <th mat-header-cell *matHeaderCellDef>
        <ngx-skeleton-loader
          [appearance]="'line'"
          [theme]="{ 'border-radius': '0', height: '20px',}"
        ></ngx-skeleton-loader>
      </th>
      <td mat-cell *matCellDef="let element">
        <ngx-skeleton-loader
          [appearance]="'line'"
          [theme]="{ 'border-radius': '0', height: '20px',}"
        ></ngx-skeleton-loader>
      </td>
    </ng-container>

    <!-- Weight Column -->
    <ng-container matColumnDef="reservedBy">
      <th mat-header-cell *matHeaderCellDef>
        <ngx-skeleton-loader
          [appearance]="'line'"
          [theme]="{ 'border-radius': '0', height: '20px',}"
        ></ngx-skeleton-loader>
      </th>
      <td mat-cell *matCellDef="let element">
        <ngx-skeleton-loader
          [appearance]="'line'"
          [theme]="{ 'border-radius': '0', height: '20px',}"
        ></ngx-skeleton-loader>
      </td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container matColumnDef="applications">
      <th mat-header-cell *matHeaderCellDef>
        <ngx-skeleton-loader
          [appearance]="'line'"
          [theme]="{ 'border-radius': '0', height: '20px',}"
        ></ngx-skeleton-loader>
      </th>
      <td mat-cell *matCellDef="let element">
        <ngx-skeleton-loader
          [appearance]="'line'"
          [theme]="{ 'border-radius': '0', height: '20px',}"
        ></ngx-skeleton-loader>
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>
        <ngx-skeleton-loader
          [appearance]="'line'"
          [theme]="{ 'border-radius': '0', height: '20px',}"
        ></ngx-skeleton-loader>
      </th>
      <td mat-cell *matCellDef="let element">
        <ngx-skeleton-loader
          [appearance]="'line'"
          [theme]="{ 'border-radius': '0', height: '20px',}"
        ></ngx-skeleton-loader>
      </td>
    </ng-container>

    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>
        <ngx-skeleton-loader
          [appearance]="'line'"
          [theme]="{ 'border-radius': '0', height: '20px',}"
        ></ngx-skeleton-loader>
      </th>
      <td mat-cell *matCellDef="let element">
        <ngx-skeleton-loader
          [appearance]="'line'"
          [theme]="{ 'border-radius': '0', height: '20px',}"
        ></ngx-skeleton-loader>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
