<section class="landing-content">
  <h1 class="welcome-title">{{ landingPageConstants.WELCOME_GREETING }}</h1>
  <span class="welcome-subtitle">{{
    landingPageConstants.WELCOME_SUBTITLE
  }}</span>

  <div class="reservation-table-container">
    <mat-tab-group class="reservation-tabs">
      <!-- Tab 1: Book Reservation -->
      <mat-tab [label]="landingPageConstants.BOOK_RESERVATION_TAB_LABEL">
        <div class="tab-content book-reservation-content">
          <!-- Show Search Options if nothing is selected -->
          <ng-container>
            <div class="card-container">
              <app-search-option-card
                *ngFor="let searchOption of searchOptionCards"
                [searchOption]="searchOption"
                (onSelected)="onCardSelected($event)"
              ></app-search-option-card>
            </div>
          </ng-container>

          <!-- Show Search By Date component if that option is selected -->
          <ng-container *ngIf="selectedSearchType === SearchType.ByDate">
            <div>
              <app-search-by-date></app-search-by-date>
            </div>
          </ng-container>

          <!-- Placeholder for Search By Application -->
          <ng-container *ngIf="selectedSearchType === SearchType.ByApplication">
            <div class="search-content">
              <app-search-application></app-search-application>
            </div>
          </ng-container>
        </div>
      </mat-tab>

      <!-- Tab 2: Your Reservations -->
      <mat-tab [label]="landingPageConstants.YOUR_RESERVATION_TAB_LABEL">
        <div class="tab-content">
          <div class="show-past-checkbox-wrapper">
            <mat-checkbox
              class="show-past-checkbox"
              (change)="onShowPastChange($event.checked)"
            >
              {{ landingPageConstants.SHOW_PAST_CHECKBOX_LABEL }}
            </mat-checkbox>
          </div>
          <div class="table-scroll-wrapper">
            <app-reservation-table
              [data]="reservations$ | async"
            ></app-reservation-table>
          </div>
        </div>
      </mat-tab>
    </mat-tab-group>
  </div>
</section>
