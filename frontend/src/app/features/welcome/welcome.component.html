<div class="welcome-wrapper">
  <div class="title-wrapper" @slideDown>
    <h2>Welcome to Gemini Enterprise Demo User App</h2>
  </div>
  <p @fadeIn class="desc-wrapper">
    App manages demo user profiles for multiple Gemini Enterprise demos listed
    on
    <a
      [href]="goDemoUrl"
      target="_blank"
      rel="noopener noreferrer"
      class="link-wrapper"
      >go/demos</a
    >. Please read the "How to Log-In" of the
    <a
      [href]="getDemoGuideLink()"
      target="_blank"
      rel="noopener noreferrer"
      class="link-wrapper"
      >demo guide</a
    >
    for detailed instructions.
  </p>
  <div class="note-wrapper" @fadeIn>
    <mat-icon>info</mat-icon>
    <p class="signup-note">
      Note: Your account is not created yet. Please click on Get Started for
      signup
    </p>
  </div>
  <div class="button-wrapper" @slideUp>
    <button matButton class="started-button" (click)="onStartSignUp()">
      Get Started
    </button>
  </div>
</div>
