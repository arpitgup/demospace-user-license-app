<mat-drawer-container class="mat-container">
  <mat-drawer mode="side" opened class="side-nav">
    <h3 class="admin-text">Admin actions</h3>
    @for(menuItems of adminMenuItems; track menuItems.id){
    <div
      class="menu-items"
      [class.selected]="menuItems.isSelected"
      (click)="onItemClicked(menuItems.type)"
    >
      <img [src]="menuItems.icon" alt="menuItems.name" class="menu-icon" />
      <h4 class="menu-title" [class.selected]="menuItems.isSelected">
        {{ menuItems.name }}
      </h4>
    </div>

    }
  </mat-drawer>
  <mat-drawer-content class="mat-content">
    @if(menuItemType()===menuItemsEnums.RESERVATION_OVERVIEW){
    <app-admin-reservation></app-admin-reservation>
    }
    @else if(menuItemType()===menuItemsEnums.APPLICATION_DOWNTIME){
    <app-admin-downtime ></app-admin-downtime>
    }
  </mat-drawer-content>
</mat-drawer-container>
