<div class="applications-container">
  <mat-tab-group
    mat-stretch-tabs="false"
    class="application-tabs"
    (selectedTabChange)="onTabChange($event)"
  >
    <mat-tab [label]="applicationConstants.LISTED_APPLICATION">
      <app-admin-application-table></app-admin-application-table>
    </mat-tab>

    <mat-tab [label]="applicationConstants.ADD_NEW_APPLICATION">
      @if(selectedIndex===1){
      <app-admin-create-application
        (applicationCreationSuccess)="applicationCreationSuccess()"
      ></app-admin-create-application>
      }
    </mat-tab>
  </mat-tab-group>
</div>
