<table mat-table [dataSource]="reservations()">
    <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Reservation Date</th>
        <td mat-cell *matCellDef="let row">{{ row.date }}</td>
    </ng-container>

    <ng-container matColumnDef="apps">
        <th mat-header-cell *matHeaderCellDef>Applications</th>
        <td mat-cell *matCellDef="let row">
            @for (app of row.apps; track app) {
            <span class="app-pill">{{ app }}</span>
            }
        </td>

    </ng-container>

    <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let row">{{ row.status }}</td>
    </ng-container>

    <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let row">
            <button mat-stroked-button color="primary" (click)="onView(row)">View</button>
            <button mat-stroked-button color="warn" (click)="onCancel(row)">Cancel</button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['date', 'apps', 'status', 'action']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['date', 'apps', 'status', 'action']"></tr>
</table>
