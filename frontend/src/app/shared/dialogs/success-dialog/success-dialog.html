<div class="header">
  <button mat-icon-button (click)="onCancel()" class="close-button">
    <mat-icon>close</mat-icon>
  </button>
  <div class="header-content">
    <img src="assets/svgs/ic_tick.svg" class="header-image" />
    <h2>{{ data.title }}</h2>
  </div>
</div>

<mat-dialog-content>
  <p [innerHTML]="data.message"></p>
</mat-dialog-content>
<mat-dialog-actions class="dialog-actions">
  <button matButton class="confirm-button" (click)="onConfirm()">
    {{ data.confirmText }}
  </button>
</mat-dialog-actions>
