server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Entry point: never cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # 2. Hashed bundles (JS & CSS): safe for aggressive caching
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 3. Web fonts
    location ~* \.(?:woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 4. Images & assets (unhashed in Angular src/assets/): 1-day cache
    location ~* \.(?:svg|png|jpg|jpeg|gif|ico|webp)$ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri =404;
    }

    # 5. Angular SPA fallback routing
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }
}