steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/${PROJECT_ID}/license-reservation-frontend-prod:$SHORT_SHA', 'Frontend' ]
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/${PROJECT_ID}/license-reservation-frontend-prod:$SHORT_SHA']
- name: 'gcr.io/cloud-builders/gcloud'
  args:
    - 'run'
    - 'deploy'
    - '${_SERVICE_NAME}'
    - '--project=${PROJECT_ID}'
    - '--region=us-central1'
    - '--platform=managed'    
    - '--image=gcr.io/${PROJECT_ID}/license-reservation-frontend-prod:$SHORT_SHA'
    - '--port=80'
options:
  logging: CLOUD_LOGGING_ONLY