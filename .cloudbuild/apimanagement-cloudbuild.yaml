steps:
  - name: "gcr.io/cloud-builders/docker"
    id: "Build"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        cd backend/
        docker build -t "gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}" -f "license-management-api/Dockerfile" .

  - name: "gcr.io/cloud-builders/docker"
    id: "Push"
    args: ["push", "gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}"]
  - name: "gcr.io/cloud-builders/gcloud"
    id: "Deploy to Cloud Run"
    args:
      [
        "run",
        "deploy",
        "${_SERVICE_NAME}",
        "--image=gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}",
        "--project=${_PROJECT_ID}",
        "--region=${_REGION}",
        "--vpc-connector=${_VPC_CONNECTOR_NAME}",
        "--set-env-vars=GCP_PROJECT_ID=${_PROJECT_ID},GCP_LOCATION=${_REGION},DB_USER=${_DB_USER},DB_HOST=${_DB_HOST},DB_PORT=${_DB_PORT},DB_NAME=${_DB_NAME},DB_PASSWORD_SECRET_NAME=${_DB_PASSWORD_SECRET_NAME},DELEGATED_ADMIN=${_DELEGATED_ADMIN},ADMIN_SERVICE_ACCOUNT_KEY_SECRET_NAME=${_ADMIN_SERVICE_ACCOUNT_KEY_SECRET_NAME},BOX_ENTERPRISE_ID_SECRET_NAME=${_BOX_ENTERPRISE_ID_SECRET_NAME},BOX_CLIENT_ID_SECRET_NAME=${_BOX_CLIENT_ID_SECRET_NAME},BOX_CLIENT_SECRET_SECRET_NAME=${_BOX_CLIENT_SECRET_SECRET_NAME}",
        "--no-allow-unauthenticated",
      ]

images:
  - "gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}"

options:
  logging: CLOUD_LOGGING_ONLY