steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/${PROJECT_ID}/license-reservation-backend-dev:${SHORT_SHA}', 'Backend']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/${PROJECT_ID}/license-reservation-backend-dev:${SHORT_SHA}']
- name: 'gcr.io/cloud-builders/gcloud'
  args:
    - 'app'
    - 'deploy'
    - 'Backend/app_prod.yaml'
    - '--version=${SHORT_SHA}'
    - '--project=${PROJECT_ID}'
    - '--image-url=gcr.io/${PROJECT_ID}/license-reservation-backend-dev:${SHORT_SHA}'
images:
  - 'gcr.io/${PROJECT_ID}/license-reservation-backend-dev:${SHORT_SHA}'
options:
  logging: CLOUD_LOGGING_ONLY
